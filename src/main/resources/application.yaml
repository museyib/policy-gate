spring:
  application:
    name: policy-gate
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/policy_gate}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false
  web:
    error:
      include-message: never
      include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    enabled: true

app:
  jwt:
    issuer: ${JWT_ISSUER:policy-gate}
    secret: ${JWT_SECRET:your-secret-key}
    access-token-expiration-minutes: ${APP_JWT_ACCESS_TTL_MINUTES:15}
    refresh-token-expiration-days: ${APP_JWT_REFRESH_TTL_DAYS:14}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:AdminPas123456}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:Bootstrap Admin}
